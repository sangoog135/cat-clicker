<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#83f4eb">
<title>КОТ — КЛИКЕР</title>
<link rel="stylesheet" href="css/style.css?v=15">
</head>
<body>

<!-- Сцена знакомства (перед игрой) -->
<div class="intro" id="intro" hidden>
  <div class="intro-stage" id="introStage">
    <div class="intro-cat" id="introCat">
      <img id="introImgA" src="sprites/stand.png" alt="кот">
      <img id="introImgB" src="sprites/stand.png" alt="">
    </div>
  </div>
  <div class="dialog" id="dialog" hidden>
    <div class="dialog-who" id="dialogWho">КОТ</div>
    <div class="dialog-text" id="dialogText"></div>
    <div class="dialog-next" id="dialogNext">▼</div>
  </div>
  <button class="intro-start" id="intro-start" hidden data-i18n="play">ИГРАТЬ</button>
</div>

<div class="game" id="game" hidden>

  <!-- Верхняя панель -->
  <header class="top">
    <div class="stat">
      <span class="stat-label" data-i18n="coins">МУРЛЫКИ</span>
      <span class="stat-value" id="coins">0</span>
    </div>
    <div class="stat small">
      <span class="stat-label" data-i18n="perClick">ЗА КЛИК</span>
      <span class="stat-value" id="perClick">1</span>
    </div>
    <div class="stat small">
      <span class="stat-label" data-i18n="level">УРОВЕНЬ</span>
      <span class="stat-value" id="level">1</span>
    </div>
  </header>

  <!-- Сцена -->
  <div class="stage" id="stage">
    <div class="cat-wrap" id="catWrap">
      <div class="cat" id="cat">
        <img id="catImg" src="sprites/stand.png" alt="кот">
        <img id="catImg2" src="sprites/stand.png" alt="">
      </div>
    </div>
    <div class="floaters" id="floaters"></div>
    <div class="hint" id="hint" data-i18n="hint">ПОЖАЛЬ В КОТА!</div>
  </div>

  <!-- Нижняя панель -->
  <footer class="bottom">
    <button class="btn small" id="intro-btn" data-i18n="intro">ЗНАКОМСТВО</button>
    <button class="btn small" id="donate-btn" data-i18n="donate">ЗАДОНАТИТЬ</button>
    <button class="btn small" id="settings-btn" data-i18n="settings">НАСТРОЙКИ</button>
    <button class="btn small" id="reset-btn" data-i18n="reset">СБРОС</button>
  </footer>
</div>

<!-- Настройки -->
<div class="modal" id="settings-modal" hidden>
  <div class="modal-box">
    <h2 data-i18n="settingsTitle">НАСТРОЙКИ</h2>
    <p class="tagline" data-i18n="tagline">САМАЯ СЛОЖНАЯ ИГРА В МИРЕ</p>

    <div class="field">
      <span class="field-label" data-i18n="name">ИМЯ ИГРОКА</span>
      <input type="text" id="name-input" maxlength="16" data-i18n-placeholder="namePh" placeholder="Как тебя зовут?">
    </div>

    <div class="field">
      <span class="field-label" data-i18n="language">ЯЗЫК</span>
      <div class="lang-switch">
        <button class="lang-btn" id="lang-ru">РУС</button>
        <button class="lang-btn" id="lang-en">ENG</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label" data-i18n="sound">ЗВУК</span>
      <button class="btn wide" id="sound-toggle">ВКЛ</button>
    </div>

    <div class="field">
      <span class="field-label" data-i18n="reset">СБРОС</span>
      <button class="btn wide danger" id="reset-confirm" data-i18n="resetConfirm">СБРОСИТЬ СЧЁТЧИК?</button>
    </div>

    <button class="btn wide" id="settings-close" data-i18n="close">ЗАКРЫТЬ</button>
  </div>
</div>

<!-- Поддержка разработчика -->
<div class="modal" id="donate-modal" hidden>
  <div class="modal-box">
    <h2 data-i18n="donateTitle">КОТ ПРОСИТ ПОДДЕРЖАТЬ РАЗРАБОТЧИКА</h2>
    <p class="modal-text" id="donate-text"></p>
    <button class="btn gold wide" id="donate-go" hidden data-i18n="donateBtn">ПОДДЕРЖАТЬ</button>
    <button class="btn wide" id="donate-close" data-i18n="close">ЗАКРЫТЬ</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/sound.js"></script>
<script src="js/i18n.js"></script>
<script src="js/intro.js"></script>
<script src="js/game.js"></script>
</body>
</html>
